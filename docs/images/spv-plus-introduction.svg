<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="440" fill="#ffffff"/>
  <title>Introducing two pages whose home nodes are far apart</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/>
    </marker>
  </defs>

  <!-- Actors -->
  <g fill="#d7f3ee" stroke="#2a9d8f" stroke-width="2">
    <rect x="30" y="60" width="90" height="44" rx="8"/>
    <rect x="640" y="60" width="90" height="44" rx="8"/>
  </g>
  <g fill="#dbe9ff" stroke="#1f6feb" stroke-width="2">
    <rect x="200" y="60" width="110" height="44" rx="8"/>
    <rect x="450" y="60" width="110" height="44" rx="8"/>
  </g>
  <g text-anchor="middle" font-weight="bold">
    <text x="75" y="80" fill="#1b6b61">Page A</text>
    <text x="75" y="96" fill="#1b6b61" font-weight="normal" font-size="11">key kA</text>
    <text x="255" y="80" fill="#0b3d91">Node N1</text>
    <text x="255" y="96" fill="#0b3d91" font-weight="normal" font-size="11">A's home node</text>
    <text x="505" y="80" fill="#0b3d91">Node N2</text>
    <text x="505" y="96" fill="#0b3d91" font-weight="normal" font-size="11">B's home node</text>
    <text x="685" y="80" fill="#1b6b61">Page B</text>
    <text x="685" y="96" fill="#1b6b61" font-weight="normal" font-size="11">key kB</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#cccccc" stroke-width="1" stroke-dasharray="4 4">
    <line x1="75" y1="104" x2="75" y2="420"/>
    <line x1="255" y1="104" x2="255" y2="420"/>
    <line x1="505" y1="104" x2="505" y2="420"/>
    <line x1="685" y1="104" x2="685" y2="420"/>
  </g>
  <text x="380" y="120" text-anchor="middle" fill="#888" font-size="11">N1 and N2 may be many hops apart, over ABC nodes</text>

  <!-- 1 rtcconfig + announce -->
  <line x1="255" y1="150" x2="75" y2="150" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="165" y="145" text-anchor="middle">1. rtcconfig (STUN port)</text>
  <line x1="75" y1="180" x2="255" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="165" y="175" text-anchor="middle">2. rtcannounce: record(kA, N1), signed</text>

  <!-- 3 gossip -->
  <line x1="255" y1="215" x2="505" y2="215" stroke="#1f6feb" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrb)"/>
  <text x="380" y="205" text-anchor="middle" fill="#0b3d91">3. rtcaddr: record + N1's certificate hashes, over the overlay</text>

  <!-- 4 B asks -->
  <line x1="505" y1="250" x2="685" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="595" y="245" text-anchor="middle">4. rtcaddr (answer to getrtcaddr)</text>

  <!-- 5 B dials N1 and signals -->
  <path d="M685 280 C 600 300, 340 300, 255 280" stroke="#2a9d8f" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="470" y="278" text-anchor="middle" fill="#1b6b61">5. B dials N1 over WebTransport, pinning the hashes from the record</text>

  <line x1="685" y1="320" x2="255" y2="320" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="255" y1="320" x2="75" y2="320" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="380" y="315" text-anchor="middle">6. rtcsignal OFFER (to kA, from kB), signed; N1 passes it to A</text>

  <line x1="75" y1="350" x2="255" y2="350" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="255" y1="350" x2="685" y2="350" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="380" y="345" text-anchor="middle">7. rtcsignal ANSWER, then CANDIDATEs both ways, each crossing N1 once</text>

  <!-- STUN -->
  <text x="380" y="380" text-anchor="middle" fill="#888" font-size="11">Meanwhile each page asks a STUN server (its node's, or a built-in one) for its public address</text>

  <!-- 8 data channel -->
  <path d="M75 405 L685 405" stroke="#2a9d8f" stroke-width="3" fill="none"/>
  <rect x="270" y="393" width="220" height="24" rx="6" fill="#ffffff" stroke="#2a9d8f"/>
  <text x="380" y="410" text-anchor="middle" fill="#1b6b61" font-weight="bold">8. WebRTC data channel: peers</text>
</svg>
