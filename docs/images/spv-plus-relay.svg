<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="360" fill="#ffffff"/>
  <title>An unconfirmed transaction travelling through pages</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Page C: the sender, no full node -->
  <rect x="30" y="140" width="140" height="56" rx="8" fill="#d7f3ee" stroke="#2a9d8f" stroke-width="2"/>
  <text x="100" y="163" text-anchor="middle" fill="#1b6b61" font-weight="bold">page C (sender)</text>
  <text x="100" y="181" text-anchor="middle" fill="#1b6b61" font-size="11">no full node</text>

  <!-- Page B: relay -->
  <rect x="270" y="140" width="140" height="56" rx="8" fill="#d7f3ee" stroke="#2a9d8f" stroke-width="2"/>
  <text x="340" y="163" text-anchor="middle" fill="#1b6b61" font-weight="bold">page B</text>
  <text x="340" y="181" text-anchor="middle" fill="#1b6b61" font-size="11">relay: 5 MB, 1 hour</text>

  <!-- Full node -->
  <rect x="510" y="140" width="120" height="56" rx="8" fill="#dbe9ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="570" y="163" text-anchor="middle" fill="#0b3d91" font-weight="bold">full node</text>
  <text x="570" y="181" text-anchor="middle" fill="#0b3d91" font-size="11">validates, mempool</text>

  <!-- Page A: the receiver, no full node -->
  <rect x="270" y="260" width="140" height="56" rx="8" fill="#d7f3ee" stroke="#2a9d8f" stroke-width="2"/>
  <text x="340" y="283" text-anchor="middle" fill="#1b6b61" font-weight="bold">page A (receiver)</text>
  <text x="340" y="301" text-anchor="middle" fill="#1b6b61" font-size="11">own filter stays local</text>

  <!-- Arrows -->
  <line x1="170" y1="168" x2="270" y2="168" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="220" y="160" text-anchor="middle" font-size="11">inv / tx</text>

  <line x1="410" y1="160" x2="510" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="460" y="152" text-anchor="middle" font-size="11">tx, to be checked</text>

  <line x1="510" y1="182" x2="410" y2="182" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="460" y="212" text-anchor="middle" font-size="11">every unconfirmed tx</text>
  <text x="460" y="226" text-anchor="middle" font-size="11">(B loads a match-all filter)</text>

  <line x1="340" y1="196" x2="340" y2="260" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="328" y="240" font-size="11" text-anchor="end">what A's filter matches</text>

  <!-- Explanation -->
  <g font-size="12" fill="#333">
    <text x="30" y="40" font-weight="bold">A page checks only that a transaction is well formed: it has no coins to check it against.</text>
    <text x="30" y="60">It passes the transaction to its full nodes, which check it, and to its page peers whose filters match it.</text>
    <text x="30" y="80">Once synced, a page loads a filter matching everything at its peers, and applies its own filter locally.</text>
    <text x="30" y="100">So its peers cannot tell which addresses are its, and it hears every payment it must pass on.</text>
  </g>
  <g font-size="11" fill="#555">
    <text x="30" y="345">The wallet shows a payment as "relayed to 1 peer" until a full node, a second peer, or a block holds it.</text>
  </g>
</svg>
