# Sample bcash config file (~/.bcash/bcash.conf)
# Every option is described in docs/Configuration.md.

#
# Options
#

# network: main

#
# Node
#

prefix: ~/.bcash
max-files: 64
cache-size: 100

#
# Workers
#

workers: true
# workers-size: 4
# workers-timeout: 120000

#
# Logger
#

log-level: debug
log-console: true
log-file: true

#
# Chain
#

prune: false
checkpoints: true
entry-cache: 5000

#
# Indexes
#

index-tx: false
index-address: false
# index-slp: false

#
# Mempool
#

mempool-size: 100
limit-free: true
limit-free-relay: 15
reject-absurd-fees: true
persistent-mempool: false

#
# Pool
#

selfish: false
compact: true
bip37: false
listen: true
max-outbound: 8
max-inbound: 30

# SOCKS5 proxy for outbound connections (turns off listening)
# proxy: foo:bar@127.0.0.1:9050
# onion: true
# upnp: true

# Custom list of DNS seeds
# seeds: seed.bitcoinabc.org

# Local Host & Port (to listen on)
host: ::
# port: 8333

# Public Host & Port (to advertise to peers)
# public-host: 1.2.3.4
# public-port: 8333

# Always try to connect to these nodes.
# nodes: 127.0.0.1,127.0.0.2

# Only try to connect to these nodes.
# only: 127.0.0.1,127.0.0.2

#
# WebTransport and STUN, for web pages (needs bip37: true)
#

# wt-port: 8335
# wt-host: 1.2.3.4
# wt-max-inbound: 64
# stun-port: 3478

#
# Avalanche (see docs/Avalanche.md)
#

# avalanche: true

#
# Miner
#

coinbase-flags: mined by bcash
# coinbase-address: ecash:qr...,ecash:qp...
preverify: false
max-size: 32000000
reserved-size: 1000
reserved-sigops: 100

#
# HTTP
#

http-host: ::
# http-port: 8332
# ssl: true
# ssl-cert: @/ssl/cert.crt
# ssl-key: @/ssl/priv.key
api-key: bikeshed
# no-auth: false
# cors: false
