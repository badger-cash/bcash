<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>bcash SPV</title>
    <style>
      body {
        margin: 16px;
        font: 14px/1.5 monospace;
        color: #111;
        background: #fff;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
    <script src="bcash-spv.js"></script>
  </head>
  <body>
    <h1>bcash SPV</h1>
    <p id="state">Loading.</p>
    <pre id="log"></pre>
    <script>
      // bcash's SPV node in the page, with no proxy: the chain in
      // IndexedDB, peers bcash full nodes over WebTransport. The seed list
      // is served beside the page, as seeds.json:
      // {"network": "testnet", "seeds": [{"host", "port", "hashes": []}]}.
      (async () => {
        const state = document.getElementById('state');
        const log = document.getElementById('log');
        const print = (msg) => {
          log.textContent = `${new Date().toISOString()} ${msg}\n`
            + log.textContent.slice(0, 20000);
        };

        try {
          const {network, seeds} = await (await fetch('seeds.json')).json();

          const node = new bcash.SPVNode({
            network,
            prefix: '/bcash',
            memory: false,
            workers: false,
            logConsole: false,
            webTransport: WebTransport,
            wtSeeds: seeds
          });

          window.node = node;

          node.on('error', err => print(`error: ${err.message}`));
          node.chain.on('connect', (entry) => {
            state.textContent = `Height ${entry.height}, `
              + `${node.pool.peers.size()} peers.`;
          });
          node.pool.on('peer open', peer => print(`peer ${peer.hostname()}`));

          await node.open();
          state.textContent = `Height ${node.chain.height}.`;
          await node.connect();
          node.startSync();
        } catch (err) {
          print(`error: ${err.message}`);
          state.textContent = 'Failed.';
        }
      })();
    </script>
  </body>
</html>
