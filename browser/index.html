<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>bcash wallet</title>
    <style>
      :root {
        --bg: #0d0f14;
        --card: #171a22;
        --line: #262b37;
        --fg: #eef0f5;
        --muted: #8a91a3;
        --accent: #00abe7;
        --accent-fg: #00121a;
        --in: #3ccf8e;
        --out: #eef0f5;
        --warn: #f0a33c;
        --err: #ff6b6b;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f3f5f9;
          --card: #ffffff;
          --line: #e1e5ee;
          --fg: #121620;
          --muted: #616a7d;
          --accent: #0088c2;
          --accent-fg: #ffffff;
          --in: #11935c;
          --out: #121620;
          --warn: #b46a00;
          --err: #c62828;
          color-scheme: light;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #app {
        max-width: 520px;
        margin: 0 auto;
        padding: 16px;
      }
      h1 {
        font-size: 1.5em;
        margin: 0 0 8px;
      }
      h2 {
        font-size: 1.05em;
        margin: 16px 0 8px;
      }
      p {
        margin: 8px 0;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 16px 0;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 0.85em;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        overflow-wrap: anywhere;
      }
      .error {
        color: var(--err);
      }
      .warn {
        color: var(--warn);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        margin: 12px 0;
      }
      .narrow {
        max-width: 420px;
        margin: 10vh auto 0;
      }
      .center {
        text-align: center;
      }
      label {
        display: block;
        margin: 12px 0 4px;
        color: var(--muted);
        font-size: 0.9em;
      }
      input, textarea, select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--fg);
        font: inherit;
      }
      input:focus, textarea:focus, select:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      textarea {
        resize: vertical;
      }
      button {
        margin: 12px 8px 0 0;
        padding: 10px 16px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button.primary {
        width: 100%;
        margin-right: 0;
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-fg);
        font-weight: 600;
      }
      button.danger {
        border-color: var(--err);
        color: var(--err);
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      .row > * {
        flex: 1;
        min-width: 0;
      }
      .row > button {
        flex: 0 0 auto;
        margin-top: 0;
        margin-right: 0;
      }
      details {
        margin-top: 20px;
      }
      summary {
        cursor: pointer;
        color: var(--muted);
      }
      header {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      header select {
        flex: 1;
        width: auto;
        min-width: 0;
      }
      .brand {
        font-weight: 700;
        font-size: 1.15em;
      }
      .brand span {
        margin-left: 6px;
        font-size: 0.65em;
        font-weight: 500;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .chip {
        margin: 0;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.8em;
        white-space: nowrap;
      }
      .chip.ok {
        color: var(--in);
      }
      .chip.wait {
        color: var(--warn);
      }
      .balance {
        text-align: center;
        padding: 28px 0 16px;
      }
      .balance .amount {
        font-size: 2.4em;
        font-weight: 700;
        letter-spacing: -0.02em;
        overflow-wrap: anywhere;
      }
      .balance .amount span {
        font-size: 0.45em;
        font-weight: 500;
        color: var(--muted);
      }
      .notice {
        background: var(--card);
        border-left: 3px solid var(--accent);
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 0.9em;
      }
      nav {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--line);
        margin: 8px 0 4px;
        overflow-x: auto;
      }
      nav button {
        margin: 0;
        border: 0;
        border-bottom: 2px solid transparent;
        border-radius: 0;
        background: none;
        color: var(--muted);
        padding: 10px 12px;
      }
      nav button.active {
        color: var(--fg);
        border-bottom-color: var(--accent);
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .history li, .keys li, .peers li {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .peers li {
        display: block;
      }
      .icon {
        flex: 0 0 36px;
        height: 36px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--card);
        border: 1px solid var(--line);
        font-weight: 700;
      }
      .icon.in {
        color: var(--in);
      }
      .what {
        flex: 1;
        min-width: 0;
      }
      .value {
        font-weight: 600;
        white-space: nowrap;
      }
      .value.in {
        color: var(--in);
      }
      .tag {
        margin-left: 6px;
        padding: 1px 6px;
        border-radius: 6px;
        border: 1px solid var(--line);
        font-size: 0.75em;
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex-direction: column;
      }
      .actions button {
        margin: 2px 0;
        padding: 6px 10px;
        font-size: 0.85em;
      }
      .empty {
        text-align: center;
        padding: 32px 0;
      }
      .qr {
        width: min(260px, 70vw);
        margin: 8px auto;
        background: #fff;
        border-radius: 12px;
        padding: 8px;
      }
      .qr svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .address {
        font-size: 0.95em;
      }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 6px 16px;
        margin: 0;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .words {
        columns: 2;
        padding-left: 28px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .words li {
        list-style: decimal;
        padding: 2px 0;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: grid;
        place-items: start center;
        padding: 16px;
        overflow-y: auto;
      }
      .modal .card {
        width: 100%;
      }
      .log {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px;
        font-size: 0.8em;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 50vh;
        overflow-y: auto;
      }
      .log .err {
        color: var(--err);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="bcash-wallet.js"></script>
  </body>
</html>
